name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: pip install markdown

      - name: Build
        run: python3 build.py

      - name: Generated files are committed
        run: |
          git diff --exit-code || {
            echo "::error::build.py changed the files above. Run python3 build.py, then commit the results."
            exit 1
          }
